multicam_ipm:
  ros__parameters:
    # Copy this file to config/*.local.yaml and set paths for your own rig.
    camchain_file: ''
    # Optional JSON with rotation camera->ego and camera position in ego metres.
    rig_calibration_file: ''
    camera_name: FM
    output_topic: /multicam/ipm
    output_frame: base_link
    publish_rate: 5.0

    # Camera-aligned ground map: longitudinal is forward from the selected
    # camera and lateral is left. This gives FM and rear-facing BM equal range.
    camera_aligned_output: true
    # Ignore the hood-dominated near field and retain a much larger road area.
    x_min: 5.0
    x_max: 30.0
    y_min: -8.0
    y_max: 8.0
    meters_per_pixel: 0.04

    # Fallback cam0 pose, used only when rig_calibration_file is empty.
    camera_height: 1.2
    camera_forward_offset: 0.0
    camera_left_offset: 0.0
    camera_roll_deg: 0.0
    camera_pitch_deg: 0.0
    camera_yaw_deg: 0.0

    # Leave empty to use each camchain rostopic unchanged.
    topic_suffix_override: ''
