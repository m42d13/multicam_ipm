surround_ipm:
  ros__parameters:
    # Copy this file to config/*.local.yaml and set paths for your own rig.
    camchain_file: ''
    rig_calibration_file: ''
    camera_name: ALL
    topic_suffix_override: ''
    output_topic: /surround/ipm
    output_frame: base_link
    publish_rate: 5.0

    # Reject a set of latest frames when their header timestamps differ too much.
    max_frame_span: 0.15
    # Avoid temporal ghosting and double edges from averaging unsynchronised
    # cameras. Each ground pixel comes from the best-facing valid camera.
    blend_mode: winner

    # Ego-centred BEV: both axes must cross zero for a true surround view.
    # X is forward/up in the image and Y is left/left in the image.
    camera_aligned_output: false
    x_min: -20.0
    x_max: 20.0
    y_min: -20.0
    y_max: 20.0
    meters_per_pixel: 0.05

    # Hide the vehicle body, whose pixels cannot be projected onto the road.
    mask_vehicle: true
    vehicle_length: 5.2
    vehicle_width: 2.3
    vehicle_center_x: 0.0

    # Unused while rig_calibration_file supplies every absolute camera pose.
    camera_height: 1.7
    camera_forward_offset: 1.5
    camera_left_offset: 0.0
    camera_roll_deg: 0.0
    camera_pitch_deg: 0.0
    camera_yaw_deg: 0.0
